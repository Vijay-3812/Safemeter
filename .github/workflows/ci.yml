name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-tests:
    name: Firmware · native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
        working-directory: firmware

  firmware-build:
    name: Firmware · ESP32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-esp32-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e esp32dev
        working-directory: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: firmware/.pio/build/esp32dev/firmware.bin

  backend:
    name: Backend · syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --check backend/functions/index.js
      - run: node --check dashboard/app.js

  tools:
    name: Tools · analysis pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements.txt
      - run: python tools/analysis/simulate_events.py --out /tmp/synth --per-class 10
      - run: python tools/analysis/evaluate.py /tmp/synth
