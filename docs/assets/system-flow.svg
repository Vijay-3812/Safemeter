<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc"><title id="title">From motion to response</title><desc id="desc">Sensors feed a three-stage ESP32 detector. A 15-second cancellation window precedes SMS to preset contacts. An optional internet connection enables Firebase volunteer dispatch and a dashboard.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#64edc9"/></marker></defs><rect width="1280" height="380" rx="20" fill="#0b1622"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="46" fill="#8ab0be" font-size="12" letter-spacing="3">THE SYSTEM / FROM MOTION TO RESPONSE</text><rect x="40" y="88" width="276" height="134" rx="12" fill="#102633" stroke="#294451"/><text x="62" y="121" fill="#64edc9" font-size="13">01</text><text x="62" y="159" fill="#eff8fa" font-size="26" font-weight="700">Sense</text><text x="62" y="192" fill="#a6bdca" font-size="15">Wheel · IMU · GPS</text><path d="M318 155 h27" stroke="#64edc9" stroke-width="2" marker-end="url(#a)"/><rect x="348" y="88" width="276" height="134" rx="12" fill="#102633" stroke="#294451"/><text x="370" y="121" fill="#64edc9" font-size="13">02</text><text x="370" y="159" fill="#eff8fa" font-size="26" font-weight="700">Decide</text><text x="370" y="192" fill="#a6bdca" font-size="15">ESP32 · 3-stage logic</text><path d="M626 155 h27" stroke="#64edc9" stroke-width="2" marker-end="url(#a)"/><rect x="656" y="88" width="276" height="134" rx="12" fill="#102633" stroke="#294451"/><text x="678" y="121" fill="#64edc9" font-size="13">03</text><text x="678" y="159" fill="#eff8fa" font-size="26" font-weight="700">Cancel</text><text x="678" y="192" fill="#a6bdca" font-size="15">15-second rider window</text><path d="M934 155 h27" stroke="#64edc9" stroke-width="2" marker-end="url(#a)"/><rect x="964" y="88" width="276" height="134" rx="12" fill="#102633" stroke="#294451"/><text x="986" y="121" fill="#64edc9" font-size="13">04</text><text x="986" y="159" fill="#eff8fa" font-size="26" font-weight="700">Alert</text><text x="986" y="192" fill="#a6bdca" font-size="15">SMS to preset contacts</text><path d="M1102 224 V271 H495" stroke="#64edc9" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)" fill="none"/><text x="40" y="279" fill="#64edc9" font-size="17">Optional connected layer</text><text x="40" y="313" fill="#a6bdca" font-size="15">Internet / gateway → Firebase → Volunteer app + incident dashboard</text><text x="40" y="350" fill="#7296a7" font-size="12">SMS needs cellular coverage. Volunteer dispatch needs internet. Emergency-service integration is a future milestone.</text></g></svg>