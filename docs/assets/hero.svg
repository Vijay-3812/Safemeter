<text x="116" y="78" fill="#e7f6f6" font-size="27" font-weight="700" letter-spacing="1">SafeMeter<tspan fill="#64edc9">.</tspan></text>
<rect x="64" y="133" width="269" height="29" rx="14" fill="#173a3c"/><circle cx="80" cy="147" r="4" fill="#64edc9"/><text x="94" y="152" fill="#8df1d4" font-size="11" letter-spacing="2">ROAD SAFETY / REIMAGINED</text>
<text x="60" y="235" fill="#f0f7fa" font-size="59" font-weight="700" letter-spacing="-2">When you can’t call,</text><text x="60" y="309" fill="#64edc9" font-size="59" font-weight="700" letter-spacing="-2">your vehicle can.</text>
<text x="64" y="362" fill="#b1c3cf" font-size="20">A smarter speedometer. A signal for help.</text><text x="64" y="393" fill="#b1c3cf" font-size="20">Built around the moments that matter.</text>
