<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">SafeMeter — When you can't call, your vehicle can.</title>
<desc id="desc">A conceptual speedometer illustration alongside the SafeMeter identity. Vehicle-powered crash detection with an SMS-first response. Hackathon prototype, not a certified safety device.</desc>
