; SafeMeter firmware — PlatformIO project
;
;   pio run -e esp32dev            build for the ESP32 dev board
;   pio run -e esp32dev -t upload  flash over USB
;   pio device monitor             115200 baud serial monitor / CSV data logger
;   pio test -e native             run the crash-detector unit tests on your PC

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

; ---------------------------------------------------------------- ESP32 target
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit BusIO@^1.16.1
    mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1
test_ignore = test_native

; ------------------------------------------------- Native (PC) unit test target
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DNATIVE_TEST
test_filter = test_native
